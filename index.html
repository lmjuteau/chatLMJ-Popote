<style>

</style></head><body><header><strong>Popote</strong><span class="pill">v0.9.3 • Popote</span></header><main class="wrap" id="app"></main><nav class="nav" id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="family-sync.js?v=083"></script><script src="family-members.js"></script><script>
const tabs=[['home','🏠','Accueil'],['inventory','🧊','Invent.'],['recipes','📖','Recettes'],['plan','🗓️','Planifier'],['shopping','🛒','Épicerie'],['specials','🏷️','Spéciaux'],['expiring','⏰','À cons.'],['feedback','💬','Suggestions'],['account','👤','Compte']];
const KEY='chatlmj-popote-local-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}state=Object.assign({inventory:[],recipes:[],shopping:[],plan:[]},state||{});let tab='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));window.popoteSync?.schedule()};const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2,7);const el=document.getElementById('app');const nav=document.getElementById('nav');const btn=(label,act,cls='')=>'<button class="'+cls+'" onclick="'+act+'">'+label+'</button>';
function go(t){tab=t;render();scrollTo(0,0)}function render(){nav.innerHTML=tabs.map(([id,ico,name])=>'<button class="'+(id===tab?'active':'')+'" onclick="go(\''+id+'\')"><span>'+ico+'</span>'+name+'</button>').join('');el.innerHTML=({home,inventory,recipes,plan,shopping,specials,expiring,feedback,account})[tab]()}
function home(){return '<div class="hero"><div>Bienvenue à la maison</div><h1>On fait de la popote? 🍲</h1><p>Recettes simples, inventaire et épicerie réunis.</p></div><div class="tiles">'+tabs.slice(1).map(([id,ico,name])=>'<div class="tile" onclick="go(\''+id+'\')"><div class="emoji">'+ico+'</div><b>'+name+'</b></div>').join('')+'</div><div class="card"><h3>Votre tableau de bord</h3><p>🥕 '+state.inventory.length+' aliments dans l’inventaire</p><p>📖 '+state.recipes.length+' recettes enregistrées</p><p>🛒 '+state.shopping.filter(x=>!x.done).length+' articles à acheter</p></div><div class="notice">Version de démarrage : données conservées uniquement sur cet appareil. Pas encore de comptes, de synchronisation familiale ni d’IA.</div>'+btn('Exporter mes données','backup()','alt')}
function inventory(){return '<h2>🧊 Inventaire</h2>'+btn('＋ Ajouter un aliment','addInventory()')+'<div class="card">'+(state.inventory.length?state.inventory.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><small>'+esc(x.qty)+' · '+esc(x.place)+' · '+(x.exp?'À consommer avant : '+esc(x.exp):'Sans date')+'</small></div><div class="actions">'+btn('Modifier','editInventory(\''+x.id+'\')','alt sm')+btn('×','remove(\'inventory\',\''+x.id+'\')','danger sm')+'</div></div>').join(''):'<p class="muted">Aucun aliment pour le moment.</p>')+'</div>'}
function recipes(){return '<h2>📖 Mes recettes</h2>'+btn('＋ Ajouter une recette','addRecipe()')+'<div class="card">'+(state.recipes.length?state.recipes.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><small>'+esc(x.minutes)+' min · '+esc(x.level)+' · '+esc(x.portions)+' portions</small></div><div class="actions">'+btn('Cuisiner','cook(\''+x.id+'\')','sm')+btn('Modifier','editRecipe(\''+x.id+'\')','alt sm')+btn('×','remove(\'recipes\',\''+x.id+'\')','danger sm')+'</div></div>').join(''):'<p class="muted">Ajoute ta première recette, simple ou spéciale.</p>')+'</div>'}
function plan(){return '<h2>🗓️ Planifier</h2><p class="muted">Choisis une date et une recette enregistrée.</p>'+btn('＋ Planifier un repas','addPlan()')+'<div class="card">'+(state.plan.length?state.plan.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<div class="item"><div><b>'+esc(x.date)+' — '+esc(x.meal)+'</b><small>'+esc(x.recipe)+'</small></div>'+btn('×','remove(\'plan\',\''+x.id+'\')','danger sm')+'</div>').join(''):'<p class="muted">Aucun repas planifié.</p>')+'</div><div class="notice">La génération automatique de menus par IA sera ajoutée dans une phase ultérieure.</div>'}
function shopping(){return '<h2>🛒 Épicerie</h2>'+btn('＋ Ajouter un article','addShopping()')+'<div class="card">'+(state.shopping.length?state.shopping.map(x=>'<div class="item"><input class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="toggleShopping(\''+x.id+'\')"><div style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'"><b>'+esc(x.name)+'</b><small>'+esc(x.qty)+'</small></div>'+btn('×','remove(\'shopping\',\''+x.id+'\')','danger sm')+'</div>').join(''):'<p class="muted">Votre liste est vide.</p>')+'</div>'}
function specials(){return '<h2>🏷️ Spéciaux</h2><div class="card"><h3>Comparaison des épiceries</h3><p>Prévu : Maxi, Super C, IGA, Métro, Costco, Mayrand et Walmart.</p><p class="muted">Les prix et circulaires ne sont pas encore connectés. Aucun prix ne sera inventé.</p></div>'}
function expiring(){const now=new Date();now.setHours(0,0,0,0);const items=state.inventory.filter(x=>x.exp).map(x=>({...x,days:Math.round((new Date(x.exp+'T12:00:00')-now)/86400000)})).sort((a,b)=>a.days-b.days);return '<h2>⏰ À consommer</h2><div class="card">'+(items.length?items.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><small>'+esc(x.exp)+' · '+(x.days<0?'Date dépassée':x.days===0?"Aujourd’hui":'Dans '+x.days+' jours')+'</small></div></div>').join(''):'<p class="muted">Aucun aliment avec date enregistrée.</p>')+'</div><div class="notice">Une date dépassée ne signifie pas automatiquement qu’un aliment est impropre; vérifie toujours sa sécurité.</div>'}

const db=window.supabase?.createClient('https://hfkauhmlftyhlhokhmvt.supabase.co','sb_publishable_kws3Rfr6i8xhD4-Aq49woQ_f25MYhuB');
let user=null,family=null,suggestions=[];
async function refreshAccount(){
 if(!db)return;
 const u=await db.auth.getUser();user=u.data?.user||null;family=null;suggestions=[];
 if(user){
  const m=await db.from('popote_members').select('family_id,role,popote_families(name)').eq('user_id',user.id).limit(1);
  if(m.error)console.warn(m.error.message);
  if(m.data?.length){
   family={id:m.data[0].family_id,role:m.data[0].role,name:m.data[0].popote_families?.name||'Mon foyer'};
   const r=await db.from('popote_suggestions').select('id,title,description,status').eq('family_id',family.id).order('created_at',{ascending:false});
   if(r.error)console.warn(r.error.message);else suggestions=r.data||[];
  }
 }
 await window.popoteSync.initialize();
 await window.popoteMembers.load();
 if(tab==='account'||tab==='feedback')render();
 if(new URLSearchParams(location.search).has('invite')&&user&&!family)await acceptInvite();
}
function account(){
 if(!db)return '<h2>👤 Compte</h2><p>Connexion indisponible. Vérifie Internet.</p>';
 if(!user)return '<h2>👤 Compte familial</h2><div class="card"><form onsubmit="return authSubmit(event)"><label>Courriel<input name="email" type="email" autocomplete="email" required></label><label>Mot de passe<input name="password" type="password" minlength="12" required></label><div class="actions"><button type="submit" name="mode" value="login">Connexion</button><button type="submit" name="mode" value="signup" class="alt">Créer un compte</button></div></form><p class="muted">Confirme ton adresse avec le courriel reçu après l’inscription.</p></div>';
 return '<h2>👤 Mon compte</h2><div class="card"><p>Connecté : '+esc(user.email)+'</p><p>Foyer : '+esc(family?.name||'À créer')+'</p>'+(family?'': '<form onsubmit="return familySubmit(event)"><label>Nom du foyer<input name="name" required maxlength="100" placeholder="Notre foyer"></label><button type="submit">Créer mon foyer</button></form>')+(family?.role==='admin'?'<div class="invite-panel"><h3>👥 Inviter un membre</h3><p class="muted">Crée un lien privé pour inviter Jinny ou un autre membre de ton foyer. Valide pendant 14 jours.</p><form onsubmit="return inviteSubmit(event)"><label>Adresse courriel de la personne<input type="email" name="invite_email" autocomplete="off" required placeholder="exemple@courriel.com"></label><button type="submit">Créer un lien d’invitation</button></form><div id="invite-result"></div></div>':'')+'<p><button class="alt" onclick="logout()">Se déconnecter</button></p></div>'+(family?'<div class="card"><h3>☁️ Synchronisation familiale</h3><p>'+(window.popoteSync.active?'Synchronisation automatique activée':'Synchronisation non activée')+'</p>'+(window.popoteSync.active?'<button class="alt" onclick="window.popoteSync.pull()">Actualiser</button>':'<p class="muted">Exporte tes données avant de les importer dans le foyer.</p><button class="alt" onclick="backup()">Exporter une sauvegarde</button> <button onclick="window.popoteSync.activate()">Importer et activer</button>')+'</div>':'')+window.popoteMembers.html()+'<div class="notice">Les suggestions sont enregistrées dans Supabase. La synchronisation des recettes, de l’inventaire, de l’épicerie et du calendrier dépend de l’activation ci-dessus.</div>';
}
async function authSubmit(e){
 e.preventDefault();const fd=new FormData(e.target),email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||'');
 const mode=e.submitter?.value||'login';
 try{
  const r=mode==='signup'?await db.auth.signUp({email,password,options:{emailRedirectTo:'https://lmjuteau.github.io/chatLMJ-Popote/'}}):await db.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  alert(mode==='signup'?'Vérifie ton courriel et confirme ton adresse avant la connexion.':'Connexion réussie!');
  await refreshAccount();
 }catch(err){alert('Connexion : '+err.message)}
 return false;
}
async function familySubmit(e){
 e.preventDefault();const name=String(new FormData(e.target).get('name')||'').trim();
 if(!name)return false;
 const r=await db.rpc('popote_create_family',{p_name:name});
 if(r.error)alert('Erreur : '+r.error.message);else{await refreshAccount();alert('Foyer créé!')}
 return false;
}
async function inviteSubmit(e){
 e.preventDefault();
 if(!db||!user||family?.role!=='admin')return false;
 const email=String(new FormData(e.target).get('invite_email')||'').trim().toLowerCase();
 const button=e.target.querySelector('button[type=submit]');button.disabled=true;
 try{
  const r=await db.rpc('popote_invite_member',{p_family_id:family.id,p_email:email});
  if(r.error)throw r.error;
  const link=new URL(location.pathname,location.origin);
  link.searchParams.set('invite',r.data);
  const target=document.getElementById('invite-result');
  if(target){
   target.innerHTML='<p><b>Lien créé!</b> Envoie ce lien uniquement à '+esc(email)+'.</p><label>Lien privé<input id="invite-link" readonly></label><button type="button" onclick="copyInvite()">Copier le lien</button><p class="muted">La personne devra se connecter ou créer son propre compte avec cette même adresse courriel. Le lien expire dans 14 jours.</p>';
   document.getElementById('invite-link').value=link.toString();
  }
 }catch(err){alert('Invitation : '+err.message)}
 finally{button.disabled=false}
 return false;
}
async function copyInvite(){
 const link=document.getElementById('invite-link')?.value;
 if(!link)return;
 try{await navigator.clipboard.writeText(link);alert('Lien copié!')}catch(e){document.getElementById('invite-link').select();alert('Sélectionne et copie le lien.')}
}
async function acceptInvite(){
 const token=new URLSearchParams(location.search).get('invite');
 if(!token||!db)return;
 if(!user){if(tab!=='account')go('account');return}
 if(family){alert('Ce compte appartient déjà à un foyer.');return}
 if(!confirm('Accepter l’invitation et rejoindre le foyer familial?'))return;
 const r=await db.rpc('popote_accept_invitation',{p_token:token});
 if(r.error){alert('Invitation : '+r.error.message);return}
 const clean=new URL(location.href);clean.searchParams.delete('invite');history.replaceState({},'',clean.toString());
 await refreshAccount();alert('Bienvenue dans le foyer!');
}
async function logout(){const r=await db.auth.signOut();if(r.error)alert(r.error.message);await refreshAccount()}
function feedback(){
 if(!db)return '<h2>💬 Suggestions</h2><p>Connexion indisponible.</p>';
 if(!user)return '<h2>💬 Suggestions</h2><div class="card"><p>Connecte-toi pour envoyer une suggestion privée.</p><button onclick="go(\'account\')">Mon compte</button></div>';
 if(!family)return '<h2>💬 Suggestions</h2><div class="card"><p>Crée ton foyer avant d’envoyer des suggestions.</p><button onclick="go(\'account\')">Créer mon foyer</button></div>';
 const statuses={nouvelle:'Nouvelle',en_cours:'En cours',acceptee:'Acceptée',terminee:'Terminée',refusee:'Refusée'};
 return '<h2>💬 Suggestions</h2><div class="card"><form onsubmit="return suggestionSubmit(event)"><label>Titre<input name="title" maxlength="150" required></label><label>Suggestion<textarea name="description" maxlength="5000" required></textarea></label><button type="submit">Envoyer ma suggestion</button></form></div><div class="card"><h3>'+(family.role==='admin'?'Demandes du foyer':'Mes demandes')+'</h3>'+(suggestions.length?suggestions.map(x=>'<div class="item suggestion-item"><div class="suggestion-body"><b>'+esc(x.title)+'</b><small>'+esc(x.description)+'</small><small>'+esc(statuses[x.status]||x.status)+'</small></div>'+(family.role==='admin'?'<select class="suggestion-status" aria-label="Statut de la suggestion" onchange="statusChange(this.dataset.id,this.value)" data-id="'+esc(x.id)+'">'+Object.entries(statuses).map(([k,v])=>'<option value="'+k+'" '+(x.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select>':'')+'</div>').join(''):'<p class="muted">Aucune suggestion.</p>')+'</div>';
}
async function suggestionSubmit(e){
 e.preventDefault();if(!user||!family)return false;
 const fd=new FormData(e.target),title=String(fd.get('title')||'').trim(),description=String(fd.get('description')||'').trim();
 if(!title||!description)return false;
 const r=await db.from('popote_suggestions').insert({family_id:family.id,author_id:user.id,title,description});
 if(r.error)alert('Erreur : '+r.error.message);else{await refreshAccount();alert('Suggestion envoyée!')}
 return false;
}
async function statusChange(id,status){
 if(family?.role!=='admin')return;
 const r=await db.from('popote_suggestions').update({status}).eq('id',id).eq('family_id',family.id);
 if(r.error)alert(r.error.message);await refreshAccount();
}
function ask(label,initial=''){return prompt(label,initial)}
function addInventory(){const name=ask('Nom de l’aliment');if(!name?.trim())return;const qty=ask('Quantité (ex. 450 g, 2 unités)','1 unité');if(qty===null)return;const place=ask('Emplacement : Réfrigérateur, Congélateur ou Garde-manger','Réfrigérateur');if(place===null)return;const exp=ask('Date de péremption (AAAA-MM-JJ), facultative','');if(exp===null)return;state.inventory.push({id:uid(),name:name.trim(),qty,place,exp});save();render()}
function editInventory(id){const x=state.inventory.find(y=>y.id===id);if(!x)return;for(const [key,label] of [['name','Nom'],['qty','Quantité'],['place','Emplacement'],['exp','Date (AAAA-MM-JJ)']]){const v=ask(label,x[key]);if(v===null)return;x[key]=v}save();render()}
function addRecipe(){const name=ask('Nom de la recette');if(!name?.trim())return;const ingredients=ask('Ingrédients (un par ligne)');if(ingredients===null)return;const steps=ask('Étapes de préparation (une étape par ligne)');if(steps===null)return;const minutes=ask('Durée totale en minutes','30');if(minutes===null)return;const portions=ask('Nombre de portions','2');if(portions===null)return;const level=ask('Complexité : Simple, Élaboré ou Spécial','Simple');if(level===null)return;state.recipes.push({id:uid(),name,ingredients,steps,minutes,portions,level});save();render()}
function editRecipe(id){const x=state.recipes.find(y=>y.id===id);if(!x)return;for(const [key,label] of [['name','Nom'],['ingredients','Ingrédients (une ligne chacun)'],['steps','Étapes (une ligne chacune)'],['minutes','Minutes'],['portions','Portions'],['level','Complexité']]){const v=ask(label,x[key]);if(v===null)return;x[key]=v}save();render()}
function cook(id){const x=state.recipes.find(y=>y.id===id);if(!x)return;const steps=x.steps.split('\n').filter(Boolean);let i=0;while(i<steps.length){const answer=confirm(x.name+'\nÉtape '+(i+1)+'/'+steps.length+'\n\n'+steps[i]+'\n\nOK = suivante; Annuler = arrêter');if(!answer)break;i++}if(i===steps.length)alert('Recette terminée! La déduction de l’inventaire sera disponible dans une prochaine version.')}
function addShopping(){const name=ask('Article à acheter');if(!name?.trim())return;const qty=ask('Quantité','1');if(qty===null)return;state.shopping.push({id:uid(),name,qty,done:false});save();render()}
function toggleShopping(id){const x=state.shopping.find(y=>y.id===id);if(x)x.done=!x.done;save();render()}
function addPlan(){if(!state.recipes.length){alert('Ajoute une recette avant de planifier un repas.');return}const date=ask('Date (AAAA-MM-JJ)',new Date().toISOString().slice(0,10));if(!date)return;const meal=ask('Repas : dîner ou souper','Souper');if(!meal)return;const options=state.recipes.map((x,i)=>(i+1)+'. '+x.name).join('\n');const choice=ask('Choisir le numéro de la recette :\n'+options,'1');if(!choice)return;const r=state.recipes[Number(choice)-1];if(!r){alert('Numéro invalide');return}state.plan.push({id:uid(),date,meal,recipe:r.name});save();render()}
function remove(kind,id){if(!confirm('Supprimer cet élément?'))return;state[kind]=state[kind].filter(x=>x.id!==id);save();render()}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chatLMJ-Popote-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();refreshAccount();
