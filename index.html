<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#227a52"><meta name="apple-mobile-web-app-capable" content="yes"><title>chatLMJ Popote</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:light-dark(#f6f8f5,#14231b);color:light-dark(#1d3025,#ecf3ed)}header{padding:18px 16px;max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}header strong{font-size:24px}header em{color:#289a65;font-style:normal}.wrap{max-width:900px;margin:auto;padding:4px 16px 110px}.hero{background:linear-gradient(120deg,#1e754d,#69a36d);color:white;border-radius:20px;padding:24px;margin-bottom:18px}.hero h1{margin:5px 0}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile,.card{background:light-dark(white,#20362a);border:1px solid light-dark(#e0e9e1,#3c5644);border-radius:17px;padding:17px}.tile{text-align:center;cursor:pointer;min-height:95px}.tile b{display:block;margin-top:7px;font-size:13px}.emoji{font-size:28px}.card{margin:12px 0}button{cursor:pointer;border:0;border-radius:11px;background:#247b53;color:white;padding:11px 14px;font:inherit;font-weight:650}button.alt{background:light-dark(#e6f0e8,#375441);color:inherit}button.sm{padding:6px 9px;font-size:12px}button.danger{background:#a4493d}input,textarea,select{display:block;width:100%;padding:11px;margin:7px 0 13px;border:1px solid #a6b8aa;border-radius:10px;font:inherit;background:light-dark(white,#294332);color:inherit}textarea{min-height:100px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid light-dark(#e4eae4,#3a5140);padding:12px 0}.item:last-child{border:0}.item div{flex:1;min-width:0}.item small{display:block;opacity:.7}.actions{display:flex;gap:7px;flex-wrap:wrap}.nav{position:fixed;bottom:0;left:0;right:0;background:light-dark(#fff,#20362a);border-top:1px solid light-dark(#dce5dd,#3d5544);display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px;padding:8px 10px max(9px,env(safe-area-inset-bottom))}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 82px;scroll-snap-align:center;background:none;color:inherit;border-radius:12px;padding:9px 4px;font-size:14px;font-weight:600;min-height:72px;touch-action:pan-x}.nav button.active{background:light-dark(#dff0e4,#375b42);color:light-dark(#16603e,#c9f0d3)}.nav span{display:block;font-size:32px;line-height:36px;margin-bottom:3px}.muted{opacity:.72;font-size:13px}.notice{background:light-dark(#fff2d8,#463820);border-radius:12px;padding:13px;margin:12px 0;font-size:13px}h2{margin:9px 0 14px}.check{width:21px;height:21px;margin:0;accent-color:#237a55}.pill{display:inline-block;background:light-dark(#e2f0e5,#31563b);border-radius:15px;padding:4px 9px;font-size:12px}@media(max-width:420px){.tile{padding:12px 4px}.tile b{font-size:11px}.nav button{font-size:14px}.nav span{font-size:32px}}
</style></head><body><header><strong>chatLMJ <em>Popote</em></strong><span class="pill">v0.3 • Locale</span></header><main class="wrap" id="app"></main><nav class="nav" id="nav"></nav>
<script>
const tabs=[['home','🏠','Accueil'],['inventory','🧊','Invent.'],['recipes','📖','Recettes'],['plan','🗓️','Planifier'],['shopping','🛒','Épicerie'],['specials','🏷️','Spéciaux'],['expiring','⏰','À cons.']];
const KEY='chatlmj-popote-local-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}state=Object.assign({inventory:[],recipes:[],shopping:[],plan:[]},state||{});let tab='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2,7);const el=document.getElementById('app');const nav=document.getElementById('nav');const btn=(label,act,cls='')=>'<button class="'+cls+'" onclick="'+act+'">'+label+'</button>';
function go(t){tab=t;render();scrollTo(0,0)}function render(){nav.innerHTML=tabs.map(([id,ico,name])=>'<button class="'+(id===tab?'active':'')+'" onclick="go(\''+id+'\')"><span>'+ico+'</span>'+name+'</button>').join('');el.innerHTML=({home,inventory,recipes,plan,shopping,specials,expiring})[tab]()}
function home(){return '<div class="hero"><div>Bienvenue à la maison</div><h1>On fait de la popote? 🍲</h1><p>Recettes simples, inventaire et épicerie réunis.</p></div><div class="tiles">'+tabs.slice(1).map(([id,ico,name])=>'<div class="tile" onclick="go(\''+id+'\')"><div class="emoji">'+ico+'</div><b>'+name+'</b></div>').join('')+'</div><div class="card"><h3>Votre tableau de bord</h3><p>🥕 '+state.inventory.length+' aliments dans l’inventaire</p><p>📖 '+state.recipes.length+' recettes enregistrées</p><p>🛒 '+state.shopping.filter(x=>!x.done).length+' articles à acheter</p></div><div class="notice">Version de démarrage : données conservées uniquement sur cet appareil. Pas encore de comptes, de synchronisation familiale ni d’IA.</div>'+btn('Exporter mes données','backup()','alt')}
function inventory(){return '<h2>🧊 Inventaire</h2>'+btn('＋ Ajouter un aliment','addInventory()')+'<div class="card">'+(state.inventory.length?state.inventory.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><small>'+esc(x.qty)+' · '+esc(x.place)+' · '+(x.exp?'À consommer avant : '+esc(x.exp):'Sans date')+'</small></div><div class="actions">'+btn('Modifier','editInventory(\''+x.id+'\')','alt sm')+btn('×','remove(\'inventory\',\''+x.id+'\')','danger sm')+'</div></div>').join(''):'<p class="muted">Aucun aliment pour le moment.</p>')+'</div>'}
function recipes(){return '<h2>📖 Mes recettes</h2>'+btn('＋ Ajouter une recette','addRecipe()')+'<div class="card">'+(state.recipes.length?state.recipes.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><small>'+esc(x.minutes)+' min · '+esc(x.level)+' · '+esc(x.portions)+' portions</small></div><div class="actions">'+btn('Cuisiner','cook(\''+x.id+'\')','sm')+btn('Modifier','editRecipe(\''+x.id+'\')','alt sm')+btn('×','remove(\'recipes\',\''+x.id+'\')','danger sm')+'</div></div>').join(''):'<p class="muted">Ajoute ta première recette, simple ou spéciale.</p>')+'</div>'}
function plan(){return '<h2>🗓️ Planifier</h2><p class="muted">Choisis une date et une recette enregistrée.</p>'+btn('＋ Planifier un repas','addPlan()')+'<div class="card">'+(state.plan.length?state.plan.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<div class="item"><div><b>'+esc(x.date)+' — '+esc(x.meal)+'</b><small>'+esc(x.recipe)+'</small></div>'+btn('×','remove(\'plan\',\''+x.id+'\')','danger sm')+'</div>').join(''):'<p class="muted">Aucun repas planifié.</p>')+'</div><div class="notice">La génération automatique de menus par IA sera ajoutée dans une phase ultérieure.</div>'}
function shopping(){return '<h2>🛒 Épicerie</h2>'+btn('＋ Ajouter un article','addShopping()')+'<div class="card">'+(state.shopping.length?state.shopping.map(x=>'<div class="item"><input class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="toggleShopping(\''+x.id+'\')"><div style="'+(x.done?'text-decoration:line-through;opacity:.6':'')+'"><b>'+esc(x.name)+'</b><small>'+esc(x.qty)+'</small></div>'+btn('×','remove(\'shopping\',\''+x.id+'\')','danger sm')+'</div>').join(''):'<p class="muted">Votre liste est vide.</p>')+'</div>'}
function specials(){return '<h2>🏷️ Spéciaux</h2><div class="card"><h3>Comparaison des épiceries</h3><p>Prévu : Maxi, Super C, IGA, Métro, Costco, Mayrand et Walmart.</p><p class="muted">Les prix et circulaires ne sont pas encore connectés. Aucun prix ne sera inventé.</p></div>'}
function expiring(){const now=new Date();now.setHours(0,0,0,0);const items=state.inventory.filter(x=>x.exp).map(x=>({...x,days:Math.round((new Date(x.exp+'T12:00:00')-now)/86400000)})).sort((a,b)=>a.days-b.days);return '<h2>⏰ À consommer</h2><div class="card">'+(items.length?items.map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><small>'+esc(x.exp)+' · '+(x.days<0?'Date dépassée':x.days===0?"Aujourd’hui":'Dans '+x.days+' jours')+'</small></div></div>').join(''):'<p class="muted">Aucun aliment avec date enregistrée.</p>')+'</div><div class="notice">Une date dépassée ne signifie pas automatiquement qu’un aliment est impropre; vérifie toujours sa sécurité.</div>'}
function ask(label,initial=''){return prompt(label,initial)}
function addInventory(){const name=ask('Nom de l’aliment');if(!name?.trim())return;const qty=ask('Quantité (ex. 450 g, 2 unités)','1 unité');if(qty===null)return;const place=ask('Emplacement : Réfrigérateur, Congélateur ou Garde-manger','Réfrigérateur');if(place===null)return;const exp=ask('Date de péremption (AAAA-MM-JJ), facultative','');if(exp===null)return;state.inventory.push({id:uid(),name:name.trim(),qty,place,exp});save();render()}
function editInventory(id){const x=state.inventory.find(y=>y.id===id);if(!x)return;for(const [key,label] of [['name','Nom'],['qty','Quantité'],['place','Emplacement'],['exp','Date (AAAA-MM-JJ)']]){const v=ask(label,x[key]);if(v===null)return;x[key]=v}save();render()}
function addRecipe(){const name=ask('Nom de la recette');if(!name?.trim())return;const ingredients=ask('Ingrédients (un par ligne)');if(ingredients===null)return;const steps=ask('Étapes de préparation (une étape par ligne)');if(steps===null)return;const minutes=ask('Durée totale en minutes','30');if(minutes===null)return;const portions=ask('Nombre de portions','2');if(portions===null)return;const level=ask('Complexité : Simple, Élaboré ou Spécial','Simple');if(level===null)return;state.recipes.push({id:uid(),name,ingredients,steps,minutes,portions,level});save();render()}
function editRecipe(id){const x=state.recipes.find(y=>y.id===id);if(!x)return;for(const [key,label] of [['name','Nom'],['ingredients','Ingrédients (une ligne chacun)'],['steps','Étapes (une ligne chacune)'],['minutes','Minutes'],['portions','Portions'],['level','Complexité']]){const v=ask(label,x[key]);if(v===null)return;x[key]=v}save();render()}
function cook(id){const x=state.recipes.find(y=>y.id===id);if(!x)return;const steps=x.steps.split('\n').filter(Boolean);let i=0;while(i<steps.length){const answer=confirm(x.name+'\nÉtape '+(i+1)+'/'+steps.length+'\n\n'+steps[i]+'\n\nOK = suivante; Annuler = arrêter');if(!answer)break;i++}if(i===steps.length)alert('Recette terminée! La déduction de l’inventaire sera disponible dans une prochaine version.')}
function addShopping(){const name=ask('Article à acheter');if(!name?.trim())return;const qty=ask('Quantité','1');if(qty===null)return;state.shopping.push({id:uid(),name,qty,done:false});save();render()}
function toggleShopping(id){const x=state.shopping.find(y=>y.id===id);if(x)x.done=!x.done;save();render()}
function addPlan(){if(!state.recipes.length){alert('Ajoute une recette avant de planifier un repas.');return}const date=ask('Date (AAAA-MM-JJ)',new Date().toISOString().slice(0,10));if(!date)return;const meal=ask('Repas : dîner ou souper','Souper');if(!meal)return;const options=state.recipes.map((x,i)=>(i+1)+'. '+x.name).join('\n');const choice=ask('Choisir le numéro de la recette :\n'+options,'1');if(!choice)return;const r=state.recipes[Number(choice)-1];if(!r){alert('Numéro invalide');return}state.plan.push({id:uid(),date,meal,recipe:r.name});save();render()}
function remove(kind,id){if(!confirm('Supprimer cet élément?'))return;state[kind]=state[kind].filter(x=>x.id!==id);save();render()}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chatLMJ-Popote-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
